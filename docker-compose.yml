version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primefactory_web
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      # Sincronizza solo la cartella pubblica. La radice del sito sarà direttamente public_html
      - ./public_html:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
    networks:
      - primefactory_net

  db:
    image: mysql:8.0
    container_name: primefactory_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=primefactory_local
      - MYSQL_USER=prime_user
      - MYSQL_PASSWORD=local_secure_pass
      - MYSQL_ROOT_PASSWORD=root_secure_pass
    volumes:
      - primefactory_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - primefactory_net

networks:
  primefactory_net:
    driver: bridge

volumes:
  primefactory_db_data:
