# Sviluppo: `docker compose up`  ->  http://localhost:3000
# Test end-to-end: `docker compose --profile e2e run --rm e2e`
name: pf-primefactory

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/it || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Profilo e2e: Playwright con browser inclusi, parla con il servizio `app`.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /app
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:3000
      CI: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "test"]

volumes:
  node_modules:
