# Sviluppo: `docker compose up`  ->  http://localhost:3000
# Test end-to-end: `docker compose --profile e2e run --rm e2e`
name: pf-primefactory

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    # Alias di rete "pf-web": il nome "app" finisce in .app (TLD con HSTS) e Chromium lo forza su https
    networks:
      default:
        aliases: [pf-web]
    ports:
      # PF_PORT permette di avviare piu copie (es. worktree) senza conflitti di porta
      - "${PF_PORT:-3000}:3000"
    env_file:
      # PF_ENV_FILE permette di usare il .env.local del repo principale da un worktree
      - path: ${PF_ENV_FILE:-.env.local}
        required: false
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/it || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Profilo e2e: Playwright con browser inclusi, parla con il servizio `app` (alias pf-web).
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://pf-web:3000
      CI: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "test"]

volumes:
  node_modules:
